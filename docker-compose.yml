services:
  nginx:
    image: nginx:1.29.8-alpine-slim
    container_name: nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api01
      - api02
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

  api01:
    image: dmorais15/rinha-backend-2026-vertx:1.0
    container_name: api01
    hostname: api01
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api02:
    image: dmorais15/rinha-backend-2026-vertx:1.0
    container_name: api02
    hostname: api02
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

networks:
  backend:
    driver: bridge
